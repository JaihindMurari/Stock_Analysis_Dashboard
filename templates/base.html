<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NSE Dashboard{% endblock %} — MarketPulse India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ── Sidebar Navigation ─────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <span class="brand-icon"><i class="bi bi-graph-up-arrow"></i></span>
      <div class="brand-text">
        <span class="brand-name">MarketPulse</span>
        <span class="brand-sub">India Equities</span>
      </div>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
      <i class="bi bi-layout-sidebar-reverse"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a href="{{ url_for('main.dashboard') }}" class="nav-item {% if active=='dashboard' %}active{% endif %}">
      <i class="bi bi-grid-1x2-fill"></i><span>Overview</span>
    </a>
    <a href="{{ url_for('main.signals_page') }}" class="nav-item {% if active=='signals' %}active{% endif %}">
      <i class="bi bi-lightning-charge-fill"></i><span>Signals</span>
    </a>
    <a href="{{ url_for('main.trends_page') }}" class="nav-item {% if active=='trends' %}active{% endif %}">
      <i class="bi bi-bar-chart-line-fill"></i><span>Trends</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="market-status" id="marketStatus">
      <span class="status-dot"></span>
      <span class="status-text">Checking…</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>
  </div>
</aside>

<!-- ── Main Content ───────────────────────────────────────────── -->
<div class="main-wrapper" id="mainWrapper">

  <!-- Top Bar -->
  <header class="topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <i class="bi bi-list"></i>
    </button>
    <div class="topbar-search">
      <i class="bi bi-search"></i>
      <input type="text" id="globalSearch" placeholder="Search stocks… (e.g. TCS, Infosys)" autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="topbar-right">
      <span class="last-updated" id="lastUpdated"><i class="bi bi-clock"></i> —</span>
      <button class="btn-refresh" id="refreshBtn" title="Trigger refresh">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </header>

  <!-- Page Content -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

</div><!-- /main-wrapper -->

<!-- Toast Notification -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
